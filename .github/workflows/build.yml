name: Build and test C
run-name: C ${{ github.sha }}
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    name: Native / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: xcode-27
            target: macos-arm64
          - os: ubuntu-24.04
            target: linux-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CC: clang
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pinned no-Unicode PCRE2 dependency
        run: |
          set -euo pipefail
          mkdir -p .build/deps
          curl --fail --location --retry 3 https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.48/pcre2-10.48.tar.gz -o .build/deps/pcre2-10.48.tar.gz
          python3 scripts/build-native-pcre2.py --archive .build/deps/pcre2-10.48.tar.gz --output .build/pcre2-8-no-unicode-no-jit --jobs 4
      - name: Build native and ASan/UBSan programs
        run: |
          set -eo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          mkdir -p .build/compile-logs
          uname -a > .build/compile-logs/host.txt
          if [[ $(uname) == Darwin ]]; then
            sw_vers > .build/compile-logs/os.txt
            xcodebuild -version > .build/compile-logs/xcode.txt
          fi
          "$CC" --version > .build/compile-logs/compiler.txt
          cp .build/pcre2-8-no-unicode-no-jit/manifest.json .build/compile-logs/pcre2.json
          cp .build/pcre2-8-no-unicode-no-jit/logs/*.log .build/compile-logs/
          lib="$PWD/.build/pcre2-8-no-unicode-no-jit/lib/libpcre2-8.a"
          cpp="-I$PWD/.build/pcre2-8-no-unicode-no-jit/include"
          test -f "$lib"
          for profile in native asan; do
            folder=../.build/$profile
            options=()
            if [[ $profile == asan ]]; then options+=(SANITIZE=1); fi
            targets=(all)
            for t in dns_test cache_domain_test fixed_config_test fixed_engine_test nft_netlink_test domain_driver nft_cli_driver; do
              targets+=("$folder/tests/$t")
            done
            make -C c -j4 CC="$CC" BUILD="$folder" PCRE2_LIB="$lib" PCRE2_CFLAGS="$cpp" "${options[@]}" "${targets[@]}" 2>&1 | tee .build/compile-logs/$profile.log
            mkdir -p .build/$profile/licenses
            cp .build/pcre2-8-no-unicode-no-jit/licenses/* .build/$profile/licenses/
          done
      - name: Package, verify and execute the complete suite
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eo pipefail
          runtime=()
          if [[ $(uname) == Darwin ]]; then
            runtime+=(--runtime-file "$(cc -print-resource-dir)/lib/darwin/libclang_rt.asan_osx_dynamic.dylib")
          fi
          profiles=(--profile native=.build/native --profile asan=.build/asan)
          python3 scripts/artifacts.py pack "${profiles[@]}" --target "$TARGET" --kind native "${runtime[@]}" --logs .build/compile-logs --output .build/pretest.tar.gz
          python3 scripts/artifacts.py extract --archive .build/pretest.tar.gz --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" --checkout . --output .build/verified
          python3 scripts/validate.py --bundle .build/verified --checkout . --output .build/ci-validation --ci
          python3 scripts/artifacts.py pack "${profiles[@]}" --target "$TARGET" --kind native "${runtime[@]}" --logs .build/compile-logs --logs .build/ci-validation --output dist/bundle.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diversion-native-${{ matrix.target }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/bundle.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Build opt-in posix-lite native and ASan/UBSan programs
        run: |
          set -euo pipefail
          mkdir -p .build/lite-compile-logs
          uname -a > .build/lite-compile-logs/host.txt
          "$CC" --version > .build/lite-compile-logs/compiler.txt
          for profile in native asan; do
            test ! -e ".build/lite/$profile"
            folder=../.build/lite/$profile
            sanitize=0
            if [[ $profile == asan ]]; then sanitize=1; fi
            targets=(all)
            for t in dns_test cache_domain_test fixed_config_test fixed_engine_test nft_netlink_test domain_driver nft_cli_driver; do
              targets+=("$folder/tests/$t")
            done
            make -C c -j4 CC="$CC" BUILD="$folder" REGEX_BACKEND=posix-lite SANITIZE="$sanitize" "${targets[@]}" 2>&1 | tee .build/lite-compile-logs/$profile.log
          done
      - name: Package, verify and execute opt-in native lite suite
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Nonempty arrays also work with nounset on macOS Bash 3.2.
          pack_options=(--profile native=.build/lite/native --profile asan=.build/lite/asan --regex-backend posix-lite --target "$TARGET" --kind native)
          if [[ $(uname) == Darwin ]]; then
            pack_options+=(--runtime-file "$(cc -print-resource-dir)/lib/darwin/libclang_rt.asan_osx_dynamic.dylib")
          fi
          python3 scripts/artifacts.py pack "${pack_options[@]}" --logs .build/lite-compile-logs --output .build/lite-pretest.tar.gz
          python3 scripts/artifacts.py extract --archive .build/lite-pretest.tar.gz --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" --checkout . --output .build/lite-verified
          python3 scripts/validate.py --bundle .build/lite-verified --checkout . --output .build/lite-ci-validation --ci
          python3 scripts/artifacts.py pack "${pack_options[@]}" --logs .build/lite-compile-logs --logs .build/lite-ci-validation --output dist/experimental-lite/bundle.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-lite-native-${{ matrix.target }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/experimental-lite/bundle.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: failure-native-${{ matrix.target }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .build/compile-logs/
            .build/pcre2-8-no-unicode-no-jit/logs/
            .build/ci-validation/
            .build/lite-compile-logs/
            .build/lite-ci-validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
  static:
    name: Static / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
            zig_target: x86_64-linux-musl
            zig_arch: x86_64
            zig_sha: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
          - os: ubuntu-24.04-arm
            target: linux-arm64
            zig_target: aarch64-linux-musl
            zig_arch: aarch64
            zig_sha: f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Pinned Zig and PCRE2 sources
        env:
          ZIG_ARCH: ${{ matrix.zig_arch }}
          ZIG_SHA: ${{ matrix.zig_sha }}
        run: |
          set -euo pipefail
          mkdir -p .build/tools .build/deps
          curl --fail --location --retry 3 https://ziglang.org/download/0.14.1/zig-$ZIG_ARCH-linux-0.14.1.tar.xz -o .build/tools/zig.tar.xz
          printf '%s  %s\n' "$ZIG_SHA" .build/tools/zig.tar.xz | sha256sum -c -
          tar -xJf .build/tools/zig.tar.xz -C .build/tools
          curl --fail --location --retry 3 https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.48/pcre2-10.48.tar.gz -o .build/deps/pcre2-10.48.tar.gz
          echo 'ebcc25aadf2a51fa1fefa9b8bc9e7a79b3dae86870a0f1152a22e42befd46888  .build/deps/pcre2-10.48.tar.gz' | sha256sum -c -
      - name: Cross build frozen static application and test harnesses
        env:
          ZIG_ARCH: ${{ matrix.zig_arch }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 benchmarks/build-c-profiles.py --output .build/static --zig .build/tools/zig-$ZIG_ARCH-linux-0.14.1/zig --target "$ZIG_TARGET" --pcre2-archive .build/deps/pcre2-10.48.tar.gz --pcre2-sha256 ebcc25aadf2a51fa1fefa9b8bc9e7a79b3dae86870a0f1152a22e42befd46888 --pcre2-origin https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.48/pcre2-10.48.tar.gz --jobs 4
      - name: Verify and test static binaries on matching Linux hardware
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/artifacts.py pack --profile static=.build/static --target "$TARGET" --kind static --output .build/pretest.tar.gz
          python3 scripts/artifacts.py extract --archive .build/pretest.tar.gz --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" --checkout . --output .build/verified
          python3 scripts/validate.py --bundle .build/verified --checkout . --output .build/ci-validation --ci
          python3 scripts/artifacts.py pack --profile static=.build/static --target "$TARGET" --kind static --logs .build/ci-validation --output dist/bundle.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diversion-static-${{ matrix.target }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/bundle.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Build opt-in posix-lite static application and harnesses
        env:
          ZIG_ARCH: ${{ matrix.zig_arch }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          set -euo pipefail
          test ! -e .build/lite/static
          mkdir -p .build/lite-compile-logs
          zig="$PWD/.build/tools/zig-$ZIG_ARCH-linux-0.14.1/zig"
          "$zig" version > .build/lite-compile-logs/compiler.txt
          uname -a > .build/lite-compile-logs/host.txt
          export ZIG_GLOBAL_CACHE_DIR="$PWD/.build/lite-zig-global-cache"
          export ZIG_LOCAL_CACHE_DIR="$PWD/.build/lite-zig-local-cache"
          folder=../.build/lite/static
          targets=(all)
          for t in dns_test cache_domain_test fixed_config_test fixed_engine_test nft_netlink_test domain_driver nft_cli_driver; do
            targets+=("$folder/tests/$t")
          done
          # Keep the static musl profile's LTO, size policy and 1 MiB thread stack.
          make -C c -j4 CC="$zig cc -target $ZIG_TARGET" AR="$zig ar" BUILD="$folder" REGEX_BACKEND=posix-lite \
            CFLAGS="-Os -flto -ffunction-sections -fdata-sections -UNDEBUG -std=c11 -Wall -Wextra -Wpedantic -Werror -pthread" \
            LDFLAGS="-flto -static -Wl,--gc-sections -Wl,-s -Wl,-z,stack-size=1048576" \
            "${targets[@]}" 2>&1 | tee .build/lite-compile-logs/static.log
          case "$ZIG_TARGET" in
            x86_64-linux-musl) machine="Advanced Micro Devices X86-64" ;;
            aarch64-linux-musl) machine="AArch64" ;;
            *) echo "unexpected static target: $ZIG_TARGET" >&2; exit 1 ;;
          esac
          for binary in .build/lite/static/mosdns-c .build/lite/static/tests/*; do
            log=".build/lite-compile-logs/$(basename "$binary")-elf.txt"
            readelf --wide --file-header --program-headers --dynamic "$binary" > "$log"
            awk -v machine="$machine" '
              $1 == "Machine:" { sub(/^[[:space:]]*Machine:[[:space:]]*/, ""); machines++; if ($0 != machine) bad=1 }
              $1 == "INTERP" || /\(NEEDED\)/ { bad=1 }
              $1 == "GNU_STACK" { stack++; if ($6 != "0x100000" || $7 != "RW") bad=1 }
              END { exit(bad || machines != 1 || stack != 1) }
            ' "$log"
          done
      - name: Verify and execute opt-in static lite suite on matching hardware
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 scripts/artifacts.py pack --profile static=.build/lite/static --regex-backend posix-lite --target "$TARGET" --kind static --logs .build/lite-compile-logs --output .build/lite-pretest.tar.gz
          python3 scripts/artifacts.py extract --archive .build/lite-pretest.tar.gz --expected-commit "$GITHUB_SHA" --expected-run-id "$GITHUB_RUN_ID" --checkout . --output .build/lite-verified
          python3 scripts/validate.py --bundle .build/lite-verified --checkout . --output .build/lite-ci-validation --ci
          python3 scripts/artifacts.py pack --profile static=.build/lite/static --regex-backend posix-lite --target "$TARGET" --kind static --logs .build/lite-compile-logs --logs .build/lite-ci-validation --output dist/experimental-lite/bundle.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-lite-static-${{ matrix.target }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/experimental-lite/bundle.tar.gz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: failure-static-${{ matrix.target }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            .build/static/manifest.json
            .build/static/logs/
            .build/static/mosdns-c
            .build/static/size/
            .build/ci-validation/
            .build/lite-compile-logs/
            .build/lite-ci-validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  delivery:
    needs: [native, static]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: diversion-*-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .build/delivery
      - name: Verify every bundle and create an immutable CI prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare-delivery.py --input .build/delivery --output dist/release
          tag=ci-$GITHUB_SHA-run$GITHUB_RUN_ID-attempt$GITHUB_RUN_ATTEMPT
          gh release create "$tag" dist/release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "CI $GITHUB_SHA (run $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT)" --notes "Four cloud build/test jobs passed. Assets retain the exact source tree, binaries, manifests and CI test logs. Verify checksums and commit/run/attempt before local validation."

  release-010:
    name: Publish v0.1.0 after six verified builds
    needs: [native, static, delivery]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'xfy-see/diversion-dns-c'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: stable-release-v0.1.0
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare pinned v0.1.0 attachment cleanup backup
        id: cleanup-prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/simplify-v0.1.0.py prepare
      - name: Archive verified original release attachments before cleanup
        id: cleanup-backup
        if: steps.cleanup-prepare.outputs.needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-v0.1.0-cleanup-backup-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .build/release-v0.1.0-cleanup/backup/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Recheck archived bytes and remove only the pinned 15 attachments
        if: steps.cleanup-prepare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_BACKUP_ARTIFACT_ID: ${{ steps.cleanup-backup.outputs.artifact-id }}
        run: python3 scripts/simplify-v0.1.0.py apply
      - name: Preserve cleanup result or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-v0.1.0-cleanup-result-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .build/release-v0.1.0-cleanup/result.json
          if-no-files-found: warn
          retention-days: 90
      - name: Install official runtime verification tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user zstd
      - name: Independently verify exact artifacts and publish this version once
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-v0.1.0.py
      - name: Preserve release verification or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-v0.1.0-verification-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: .build/release-v0.1.0/assets/
          if-no-files-found: warn
          retention-days: 90
