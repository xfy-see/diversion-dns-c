# Staged defaults. Configure upstreams and CN rules before enabling the service.
listen_udp=127.0.0.1:15353
listen_tcp=127.0.0.1:15353
cn_domain_file=/etc/diversion-dns/cn-domains.txt
cn_upstream=127.0.0.1:5301
foreign_upstream=tcp://127.0.0.1:5302
cache_size=1024
cache_lazy_ttl=0
nftset_fast=0
stats_file=/tmp/diversion-dns-stats.json
stats_interval=10
