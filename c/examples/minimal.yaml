# A foreground resolver on loopback; replace upstream IPs for your network.
log:
  level: info
plugins:
  - tag: cn_site
    type: domain_set
    args:
      exps: ["domain:cn", "full:example.com"]
      # files: ["/etc/mosdns/cn-site.txt"]
  - tag: cache
    type: cache
    args:
      size: 1024
      lazy_cache_ttl: 0
  - tag: direct
    type: forward
    args:
      upstreams:
        - addr: "223.5.5.5:53"
  - tag: foreign
    type: forward
    args:
      upstreams:
        - addr: "tcp://1.1.1.1:53"
  - tag: main
    type: sequence
    args:
      - exec: $cache
      - matches: [has_resp]
        exec: accept
      - matches: [qname $cn_site]
        exec: goto resolve_cn
      - exec: $foreign
  - tag: resolve_cn
    type: sequence
    args:
      - exec: $direct
  - type: udp_server
    args:
      entry: main
      listen: "127.0.0.1:15362"
  - type: tcp_server
    args:
      entry: main
      listen: "127.0.0.1:15362"
      idle_timeout: 10
