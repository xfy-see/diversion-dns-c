# Linux deployment example, migrated from docs/go-profiles-site-only.yaml.
# Prepare the rule file, interfaces, marks/routes, and existing nft sets first.
# c131tm is a historical test interface; replace it with the real tunnel.
# Migrated site-only configuration; paths remain relative to the process working directory.
listen_udp=127.0.0.1:15361
listen_tcp=127.0.0.1:15361
tcp_idle_timeout=10
cn_domain_file=/etc/mosdns/cn-site.txt
cache_size=1024
cache_lazy_ttl=0
cn_upstream=192.168.100.1:53
cn_mark=16777216
cn_interface=br-lan
cn_concurrent=1
foreign_upstream=1.1.1.1:53
foreign_mark=33554432
foreign_interface=c131tm
foreign_concurrent=1
nftset_ipv4=inet,mosdns_cn,cn_site4,ipv4_addr,32
nftset_ipv6=inet,mosdns_cn,cn_site6,ipv6_addr,128
