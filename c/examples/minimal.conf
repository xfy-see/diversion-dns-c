# Run from the repository root, or use -d /path/to/repository.
# Loopback upstreams are safe placeholders, not working public resolvers.
# Start local test resolvers on 5301/5302, or replace them and the demo rules.
listen_udp=127.0.0.1:15362
listen_tcp=127.0.0.1:15362
cn_domain_file=c/examples/cn-site.txt
cn_upstream=127.0.0.1:5301
foreign_upstream=tcp://127.0.0.1:5302
cache_size=1024
cache_lazy_ttl=0
tcp_idle_timeout=30
